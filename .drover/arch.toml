generated = ["crates/gatekeeper/src/cmd/mod.rs", "crates/gatekeeper-engine/src/check/mod.rs", "skill/gatekeeper/**"]
generate = "sh scripts/gen.sh"
frozen = ["crates/gatekeeper-engine/src/skill.rs"]
shared = ["crates/gatekeeper-engine/src/run.rs"]

[[collect]]
dir = "crates/gatekeeper/src/cmd"
glob = "*.rs"

[[collect]]
dir = "crates/gatekeeper-engine/src/check"
glob = "*.rs"

[[collect]]
dir = "crates/gatekeeper-engine/src/arch"
glob = "*.rs"

[[collect]]
dir = "crates/gatekeeper-engine/src/docs"
glob = "*.rs"

[[collect]]
dir = "packs"
glob = "*/gates/*.toml"

[[collect]]
dir = "packs"
glob = "*/fixtures/**"

[[collect]]
dir = "crates/gatekeeper-engine/tests/cache"
glob = "*/case.toml"

[[collect]]
dir = "crates/gatekeeper-engine/tests/select"
glob = "*/case.toml"

[[collect]]
dir = "crates/gatekeeper-engine/tests/split"
glob = "*/case.toml"

[[collect]]
dir = "crates/gatekeeper-engine/src/skill/topics"
glob = "*.md"

[[collect]]
dir = "crates/gatekeeper-engine/src/ratchet"
glob = "*.rs"

[[collect]]
dir = "crates/gatekeeper-engine/tests/ratchet"
glob = "*/case.toml"

[[layer]]
name = "model"
paths = ["crates/gatekeeper-model/src/**"]
mods = ["gatekeeper_model"]
may_use = []

[[layer]]
name = "engine"
paths = ["crates/gatekeeper-engine/src/**"]
mods = ["gatekeeper_engine"]
may_use = ["model"]

[[layer]]
name = "cli"
paths = ["crates/gatekeeper/src/**"]
may_use = ["engine", "model"]

[[ban]]
pattern = "Command::new"
paths = ["crates/*/src/**"]
except = ["crates/gatekeeper-engine/src/runner.rs"]
reason = "start processes through the engine's runner"

[[ban]]
pattern = "cargo "
paths = [".github/workflows/gates.yml"]
reason = "a gate runs through gatekeeper check; the workflow only provisions"

[[ban]]
pattern = "secrets: inherit"
paths = [".github/workflows/**"]
reason = "a workflow names each secret it reads"

[[ban]]
pattern = "env::var"
paths = ["crates/gatekeeper-engine/src/**", "crates/gatekeeper-model/src/**"]
reason = "the cli reads the environment once and passes typed values"

[[ban]]
pattern = "github.event_name"
paths = [".github/workflows/gates.yml"]
reason = "ci plan decides which runs read and write the result cache; the workflow only moves the folder"

[[ban]]
pattern = "runner::"
paths = ["crates/gatekeeper-engine/src/select/rules.rs", "crates/gatekeeper-engine/src/select/readers.rs", "crates/gatekeeper-engine/src/select/split.rs"]
reason = "the selection rules are pure: evidence in, a selection out"

[[ban]]
pattern = "fs::"
paths = ["crates/gatekeeper-engine/src/select/rules.rs", "crates/gatekeeper-engine/src/select/readers.rs", "crates/gatekeeper-engine/src/select/split.rs"]
reason = "the selection rules are pure: evidence in, a selection out"

[[ban]]
pattern = ".bin/vitest"
paths = ["crates/*/src/**"]
except = ["crates/gatekeeper-engine/src/select/vitest.rs"]
reason = "one module finds and runs the repo's vitest"

[[ban]]
pattern = "docs::"
paths = ["crates/gatekeeper-engine/src/arch/**"]
reason = "the docs gate reads arch's config and diff; arch never calls the docs gate"

[[ban]]
pattern = "tool = \"drover\""
paths = ["packs/**"]
reason = "the core pack's checks are built in; no gate calls drover"

[[ban]]
pattern = "{tool:drover}"
paths = ["packs/**"]
reason = "the core pack's checks are built in; no gate calls drover"

[[size]]
paths = ["crates/*/src/**/*.rs"]
max_file_lines = 400
max_fn_lines = 60

[[size]]
paths = ["crates/gatekeeper-engine/src/run.rs"]
max_file_lines = 150

[comments]
policy = "strict"
except = ["packs/*/fixtures/**"]

[[ban]]
pattern = "runner::"
paths = ["crates/gatekeeper-engine/src/ratchet/**"]
except = ["crates/gatekeeper-engine/src/ratchet/change.rs"]
reason = "the ratchet rules are pure: a tool's output in, findings out; one module reads git"

[[ban]]
pattern = "fs::"
paths = ["crates/gatekeeper-engine/src/ratchet/**"]
except = ["crates/gatekeeper-engine/src/ratchet/folder.rs", "crates/gatekeeper-engine/src/ratchet/change.rs"]
reason = "the ratchet rules are pure: a tool's output in, findings out; two modules read files"
