about = "line coverage of the workspace's tests is not under the integration branch's"
fix = "cover the lines the change added, or delete the dead code"
budget_secs = 900
needs = ["coverage"]
leg = "coverage"
setup = ["rust"]
run = "{tool:cargo-llvm-cov} llvm-cov --workspace --all-features --locked --json --summary-only --output-path target/cov.json"

[coverage]
tool = "llvm-cov"
summary = "target/cov.json"
