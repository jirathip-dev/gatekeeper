packs = ["core", "rust", "ts"]
integration = "staging"
pin = "checkout"

[ts]
projects = ["packs/supabase/scripts"]
install = "npm ci --no-audit --no-fund --loglevel=error"

[tools]
anti-slop-swift = "target/anti-slop/debug/anti-slop"

[legs.macos]
platform = "macos"
setup = ["rust"]

[legs.coverage]
platform = "linux"
setup = ["rust"]

[tests]
soak = ["crates/*/tests/perf.rs"]

[cache]
recheck = 1

[docs.records]
"skill/gatekeeper/examples/**" = "each page quotes fixture cases: the paths it names are the fixture repo's, not this repo's"

[docs.names]
run = "sh scripts/names.sh"

[docs.names.sets]
verb = ["./.gatekeeper/run {name}", "gatekeeper {name}"]
core = ["core/{name}"]
rust = ["rust/{name}"]
swift = ["swift/{name}"]
ts = ["ts/{name}"]
supabase = ["supabase/{name}"]

[off]
"rust/dead-code" = "gatekeeper writes its own list when it adopts the code ratchets (slice R5 of the code ratchets ADR, #100)"
"rust/complexity" = "gatekeeper writes its own list when it adopts the code ratchets (slice R5 of the code ratchets ADR, #100)"
"core/cap" = "drover has no line cap (#1812)"
