version = "1.0.16"

[asset.aarch64-apple-darwin]
url = "https://github.com/jirathip-dev/gatekeeper/releases/download/tool-libde265-1.0.16-67bd6057854c/libde265-1.0.16-aarch64-apple-darwin.tar.gz"
sha256 = "aecac91f366681b8483d582d296db1b75042214f5e36d6c8d1427b65bf317d8b"
bin = "lib/pkgconfig/libde265.pc"

[asset.aarch64-unknown-linux-gnu]
url = "https://github.com/jirathip-dev/gatekeeper/releases/download/tool-libde265-1.0.16-67bd6057854c/libde265-1.0.16-aarch64-unknown-linux-gnu.tar.gz"
sha256 = "feefaa63ee65a36627ef7cdd910a99f79f52cddd533538d78aab1d1ec92bfe88"
bin = "lib/pkgconfig/libde265.pc"

[asset.x86_64-unknown-linux-gnu]
url = "https://github.com/jirathip-dev/gatekeeper/releases/download/tool-libde265-1.0.16-67bd6057854c/libde265-1.0.16-x86_64-unknown-linux-gnu.tar.gz"
sha256 = "2e9526d3215af3eea109a1025724668f8e2bb8e305c4ce11b6ad97ef22c15b62"
bin = "lib/pkgconfig/libde265.pc"

[build]
targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu", "aarch64-apple-darwin"]
budget_minutes = 10
bin = "lib/pkgconfig/libde265.pc"
script = """
curl -sSfL -o src.tar.gz "https://github.com/strukturag/libde265/releases/download/v$VERSION/libde265-$VERSION.tar.gz"
echo "b92beb6b53c346db9a8fae968d686ab706240099cdd5aff87777362d668b0de7  src.tar.gz" | shasum -a 256 -c
tar -xzf src.tar.gz
cmake -S "libde265-$VERSION" -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF \
  -DCMAKE_POSITION_INDEPENDENT_CODE=ON -DENABLE_DECODER=OFF -DENABLE_ENCODER=OFF -DENABLE_SDL=OFF \
  -DCMAKE_INSTALL_PREFIX="$OUT" -DCMAKE_INSTALL_LIBDIR=lib -DCMAKE_INSTALL_INCLUDEDIR=include
cmake --build build --parallel
cmake --install build
sed -i.orig 's|^prefix=.*|prefix=${pcfiledir}/../..|' "$OUT/lib/pkgconfig/libde265.pc"
rm "$OUT/lib/pkgconfig/libde265.pc.orig"
"""
