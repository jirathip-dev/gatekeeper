version = "0.8.6"

[build]
targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu", "aarch64-apple-darwin"]
budget_minutes = 20
bin = "bin/sqlx"
script = """
cargo install sqlx-cli --version "$VERSION" --locked --no-default-features --features postgres,rustls --root "$OUT"
rm -f "$OUT/.crates.toml" "$OUT/.crates2.json"
"""
