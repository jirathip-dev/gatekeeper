about = "every direct dependency of Cargo.toml, package.json and Package.swift (with their workspaces) is listed with a reason in .gatekeeper/deps.toml; a PR grows Cargo.lock, pnpm-lock.yaml and Package.resolved by at most the file's `growth` packages"
fix = "ask the owner before you add a dependency; then list it with its reason, drop a stale entry, and for growth over the limit put `Deps: #<issue> <the owner's answer>` in a commit message"
budget_secs = 5
rule = [
    "Crypto, TLS, signatures and parsers of files from outside are never written in-house: use a proven library.",
    "Small glue with no hostile input is written in-house.",
    "Tools (linters, checkers) are used as they are, pinned and checksummed, never forked.",
    "Build frameworks are not added where gatekeeper already does the job.",
    "To add a dependency: ask the owner first; then list it in .gatekeeper/deps.toml with its one-line reason; if the lockfiles grow by more than the file's `growth`, add `Deps: #<issue> <the owner's answer>` to a commit message, the way a cap raise carries its `Cap:` line. Lowering `growth` is free; a raise counts only from the next PR.",
]

[[step]]
check = "deps"
