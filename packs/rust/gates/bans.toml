about = "the 12 clippy denies, unsafe_code forbid and pedantic warn are in [workspace.lints] and in any crate's own [lints]; clippy refuses each banned-API file under them"
fix = "put the lint back at the floor's level; a crate that needs unsafe is named in [rust] unsafe_crates with its own [lints] denying clippy::undocumented_unsafe_blocks and a // SAFETY: line over each unsafe block; a floor that is wrong is changed in gatekeeper"
budget_secs = 30
rule = [
    "A crate named in `[rust] unsafe_crates` of `.gatekeeper/config.toml` (e.g. `unsafe_crates = [\"gpu\"]`) may set `unsafe_code` to allow, warn or deny; every other crate stays at forbid.",
    "A named crate states its lints in its own `[lints]` table, not `workspace = true`: the 12 clippy denies, pedantic warn and `clippy::undocumented_unsafe_blocks = \"deny\"`.",
    "Each `unsafe {` in a named crate has a `// SAFETY:` comment on its line or in the comment lines right above it.",
    "A name that is no workspace member is a finding.",
]

[[step]]
check = "lint-floor"

[[step]]
check = "banned-apis"
