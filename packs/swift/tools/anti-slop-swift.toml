version = "1.0.0"

[asset.aarch64-apple-darwin]
url = "https://github.com/jirathip-dev/gatekeeper/releases/download/tool-anti-slop-swift-1.0.0-4adb00ead57d/anti-slop-swift-1.0.0-aarch64-apple-darwin.tar.gz"
sha256 = "3b62d330dc7bfb24c1c29e0accd6c64615d49a1d6a1755f0ffaa576bd52b4f6d"
bin = "bin/anti-slop"

[build]
targets = ["aarch64-apple-darwin"]
budget_minutes = 30
bin = "bin/anti-slop"
script = """
src="$GITHUB_WORKSPACE/packs/swift/anti-slop"
test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD:packs/swift/anti-slop)" = "b5aec72565ae0a94c6d17f355a884f2a75ea6d30"
swift build -c release --package-path "$src" --scratch-path build
mkdir -p "$OUT/bin"
cp build/release/anti-slop "$OUT/bin/anti-slop"
"$OUT/bin/anti-slop" --list-rules
"""
