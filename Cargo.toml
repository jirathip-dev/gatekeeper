[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "1.1.2"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
gatekeeper-model = { path = "crates/gatekeeper-model", version = "1.1.2" }
gatekeeper-engine = { path = "crates/gatekeeper-engine", version = "1.1.2" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
toml = "1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
indexing_slicing = "deny"
as_conversions = "deny"
print_stdout = "deny"
print_stderr = "deny"
allow_attributes_without_reason = "deny"
let_underscore_must_use = "deny"
