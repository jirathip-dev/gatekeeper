about = "a diff inside one test function runs that test twice more and no other"
runner = "nextest"
trigger = "pull-request"
runs = ["nextest.xml", "nextest-rerun-adds.xml", "nextest-rerun-adds.xml"]
slow = ["demo-app board::tests::renders_slowly"]
rerun = ["demo-app tests::adds"]
only = "-E '(binary_id(=demo-app) & test(=tests::adds))'"
findings = ["failed: demo-app tests::fails_on_purpose"]
warnings = ["warn: over 2 s, listed: demo-app board::tests::renders_slowly 2.5 s"]
diff = '''
diff --git a/src/lib.rs b/src/lib.rs
--- a/src/lib.rs
+++ b/src/lib.rs
@@ -7 +7 @@ mod tests {
-    fn adds() { assert_eq!(add(1, 2), 3); }
+    fn adds() { assert_eq!(add(2, 1), 3); }
'''

[krates]
"" = "demo-app"

[head]
"src/lib.rs" = '''pub mod board;
pub fn add(a: u32, b: u32) -> u32 { a + b }
#[cfg(test)]
mod tests {
    use super::*;
    #[test]
    fn adds() { assert_eq!(add(2, 1), 3); }
    #[test]
    fn fails_on_purpose() { assert_eq!(add(1, 2), 4); }
    #[test]
    #[ignore]
    fn ignored() {}
}
'''
