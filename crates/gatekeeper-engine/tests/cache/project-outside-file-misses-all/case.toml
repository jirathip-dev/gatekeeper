gate = { run = "true", projects = ["pkgs/*"], versions = ["echo 1"] }
cache = {}
scope = { graphs = ["pnpm"], ignore = ["docs/**"] }

[files]
"pnpm-workspace.yaml" = "packages:\n  - 'pkgs/*'\n"
"pkgs/a/package.json" = '{"name": "a"}'
"pkgs/b/package.json" = '{"name": "b", "dependencies": {"a": "*"}}'
"pkgs/c/package.json" = '{"name": "c", "dependencies": {"b": "*"}}'
"pkgs/d/package.json" = '{"name": "d"}'

[[run]]
trigger = "lane"
expect = "ok"

[[run]]
trigger = "lane"
edit = { "docs/x.md" = "ignored by [scope]" }
expect = "cached"

[[run]]
trigger = "lane"
edit = { "README.md" = "outside every project" }
expect = "ok"
contains = '"projects":["pkgs/a","pkgs/b","pkgs/c","pkgs/d"]'
