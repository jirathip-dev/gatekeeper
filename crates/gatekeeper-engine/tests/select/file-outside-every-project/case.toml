about = "a file outside every project no longer runs everything: the guard runs"

[select]
vitest = "vitest.config.ts"
always = ["packages/tools/guards/**"]
full = []

[files]
".github/workflows/ci.yml" = "on: push\n"
"packages/tools/guards/licence.test.ts" = "it('has a licence', () => {});\n"

[change]
".github/workflows/ci.yml" = "on: pull_request\n"

[expect]
"packages/tools/guards/licence.test.ts" = ["always-path"]
