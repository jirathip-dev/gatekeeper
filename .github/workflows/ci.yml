name: ci
on:
  pull_request:
  push:
    branches: [staging]

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: actionlint
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/914e7df21a07ef503a81201c76d2b11c789d3fca/scripts/download-actionlint.bash) 1.7.12
          ./actionlint -color

  arch-check:
    uses: jirathip-dev/drover/.github/workflows/arch-check.yml@8bb4ced84a468786cdf04faa9d4f343692b5c979 # staging
